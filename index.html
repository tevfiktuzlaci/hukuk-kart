  #app{width:100%;max-width:520px;display:flex;flex-direction:column;padding:14px 16px 18px;min-height:100dvh}
  .fre{font-family:"Fredoka","Archivo",sans-serif}

  /* ---------- ust serit ---------- */
  .serit{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px}
  .ilerleme{
    font-family:"Fredoka",sans-serif;font-size:14px;font-weight:500;color:var(--murekkep);
    background:rgba(253,251,246,.82);padding:5px 11px 6px;border-radius:99px;
    box-shadow:0 2px 6px rgba(60,45,30,.14);white-space:nowrap;backdrop-filter:blur(3px);
  }
  .ilerleme b{color:var(--turuncu);font-weight:600}
  .tekrar-rozet{
    display:inline-block;margin-left:7px;padding:1px 7px 2px;border-radius:99px;
    background:var(--lacivert);color:#fff;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  }
  .sol{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .menu-tus,.geri-tus{
    width:auto;flex:0 0 auto;line-height:1;font-family:"Fredoka",sans-serif;font-weight:500;
    border:none;color:var(--murekkep);background:rgba(253,251,246,.86);
    box-shadow:0 2px 6px rgba(60,45,30,.16);border-radius:99px;backdrop-filter:blur(3px);
  }
  .menu-tus{padding:7px 11px;font-size:15px}
  .geri-tus{padding:7px 12px;font-size:13px}
  .menu-tus:hover,.geri-tus:hover{background:#fff;color:var(--turuncu)}

  /* ---------- cetele ---------- */
  .cetele-alan{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:1;overflow:hidden}
  .cetele{display:flex;gap:8px;align-items:flex-end;justify-content:flex-end;height:20px;overflow:hidden;direction:rtl}
  .grup{position:relative;width:24px;height:19px;flex:0 0 auto}
  .grup svg{position:absolute;inset:0;overflow:visible}
  .grup path{
    stroke:var(--murekkep);stroke-width:2.4;stroke-linecap:round;fill:none;opacity:.75;
    stroke-dasharray:26;stroke-dashoffset:26;animation:ciz .22s ease-out forwards;
    filter:drop-shadow(0 1px 2px rgba(255,255,255,.85));
  }
  @keyframes ciz{to{stroke-dashoffset:0}}
  .kombo-yazi{
    font-family:"Fredoka",sans-serif;font-size:12px;font-weight:500;color:var(--murekkep);
    height:15px;text-align:right;text-shadow:0 1px 3px rgba(255,255,255,.9)
  }
  .sicak .grup path{stroke:var(--turuncu);opacity:1}
  .sicak .kombo-yazi{color:var(--turuncu)}
  .kirildi .grup path{stroke:var(--soluk);animation:sil .3s ease-in forwards}
  @keyframes sil{to{opacity:0;transform:translateY(6px) rotate(2deg)}}

  /* ---------- kart ---------- */
  .sahne{flex:1;display:flex;align-items:center;perspective:1400px;padding:14px 2px}
  .kart{
    width:100%;background:var(--kagit);color:var(--murekkep);
    padding:26px 22px 24px;position:relative;border-radius:3px;
    box-shadow:
      0 1px 1px rgba(60,45,30,.10),
      0 6px 14px rgba(60,45,30,.16),
      0 22px 40px -18px rgba(60,45,30,.45);
    transform:rotateY(0deg);transition:transform .19s ease-in;backface-visibility:hidden;
  }
  .kart::before,.kart::after{
    content:"";position:absolute;top:-9px;width:52px;height:19px;
    background:rgba(226,214,186,.75);box-shadow:0 1px 3px rgba(60,45,30,.18);
  }
  .kart::before{left:16px;transform:rotate(-3deg)}
  .kart::after{right:16px;transform:rotate(2.5deg)}
  .kart.yarim{transform:rotateY(90deg)}
  .kart-ust{position:absolute;top:9px;right:12px;display:flex;align-items:center;gap:6px}
  .kart-no{font-family:"Fredoka",sans-serif;font-size:13px;color:var(--soluk)}
  .yildiz-tus{width:auto;flex:0 0 auto;padding:0 2px;border:none;background:none;box-shadow:none;font-size:19px;line-height:1;color:#D8CDB8}
  .yildiz-tus:hover{color:var(--amber)}
  .yildiz-tus.acik{color:var(--amber)}
  .etiket{
    font-family:"Fredoka",sans-serif;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--soluk);margin-bottom:10px;
  }
  .soru{font-size:19px;line-height:1.36;font-weight:600;letter-spacing:-.01em;text-wrap:pretty}
  .kart.arka .soru{font-size:14px;font-weight:500;color:var(--soluk);line-height:1.42}

  .yazi-alan{margin-top:18px}
  textarea{
    width:100%;min-height:94px;resize:vertical;background:#FAF6EC;
    border:none;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--cizgi);
    font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.65;
    color:var(--murekkep);padding:10px 12px;outline:none;
  }
  textarea:focus{box-shadow:inset 0 0 0 2px var(--amber);background:#fff}
  textarea::placeholder{color:#B6AB99}

  .ayrac{height:1px;background:var(--cizgi);margin:20px 0 18px}
  .senin{margin-bottom:18px}
  .senin .metin{
    font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.6;
    white-space:pre-wrap;color:var(--soluk);border-left:3px solid var(--cizgi);padding-left:12px;
  }
  .cevap{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.62}
  .cevap p{margin-bottom:9px}
  .cevap p:last-child{margin-bottom:0}
  .cevap .madde{display:flex;gap:10px;margin-bottom:7px}
  .cevap .madde span:first-child{font-family:"Fredoka",sans-serif;font-size:14px;color:var(--turuncu);flex:0 0 auto;padding-top:2px}
  .cevap .not{font-size:15px;color:var(--soluk);font-style:italic;margin-bottom:12px}
  .cevap .not.son{
    margin:15px 0 0;padding:11px 13px;font-style:normal;border-radius:6px;
    background:#FBF3DF;color:#6B5638;border-left:3px solid var(--amber);
  }

  /* ---------- dugmeler ---------- */
  .dip{display:flex;flex-direction:column;gap:9px}
  button{
    font-family:"Fredoka","Archivo",sans-serif;font-size:16px;font-weight:500;
    border:none;background:var(--kagit);color:var(--murekkep);
    padding:14px 16px;border-radius:11px;cursor:pointer;width:100%;
    box-shadow:0 2px 0 rgba(60,45,30,.16), 0 5px 14px rgba(60,45,30,.20);
    transition:transform .07s ease, box-shadow .07s ease, filter .12s;
  }
  button:hover{filter:brightness(1.03)}
  button:active{transform:translateY(2px);box-shadow:0 0 0 rgba(60,45,30,.16), 0 3px 8px rgba(60,45,30,.18)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .dolu{background:var(--turuncu);color:#fff}
  .uclu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .uclu button{font-size:14px;padding:14px 4px}
  .ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b-bildim{background:var(--yesil);color:#fff}
  .b-yarim{background:var(--amber);color:#4A3719}
  .b-bilemedim{background:var(--bordo);color:#fff}
  .ipucu{
    font-family:"Fredoka",sans-serif;font-size:12px;color:var(--murekkep);text-align:center;
    text-shadow:0 1px 3px rgba(255,255,255,.9);opacity:.8;
  }
  .sonuc-rozet{
    display:inline-block;padding:3px 10px 4px;border-radius:99px;color:#fff;
    font-family:"Fredoka",sans-serif;font-size:11px;letter-spacing:.04em;
  }
  .r-bildim{background:var(--yesil)}
  .r-yarim{background:var(--amber);color:#4A3719}
  .r-bilemedim{background:var(--bordo)}
  .gecmis-baslik{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

  /* ---------- giris / bitis ---------- */
  .orta{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:16px 0}
  .pano{
    background:rgba(253,251,246,.93);border-radius:14px;padding:22px 20px;
    box-shadow:0 2px 6px rgba(60,45,30,.14), 0 20px 40px -20px rgba(60,45,30,.5);
    backdrop-filter:blur(4px);
  }
  h1{
    font-family:"Fredoka",sans-serif;font-size:36px;font-weight:600;line-height:1.06;
    color:var(--murekkep);letter-spacing:-.015em;
  }
  h1 em{font-style:normal;color:var(--turuncu)}
  .alt{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.55;color:var(--soluk);margin-top:10px}
  .kural{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--cizgi);padding-top:15px;margin-top:16px}
  .kural div{display:flex;gap:10px;font-size:13.5px;line-height:1.45;color:var(--soluk)}
  .kural b{font-family:"Fredoka",sans-serif;font-weight:500;color:var(--amber);flex:0 0 18px;font-size:12px;padding-top:2px}
  .sayilar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .sayilar div{background:rgba(253,251,246,.93);border-radius:11px;padding:14px 8px;text-align:center;box-shadow:0 5px 14px rgba(60,45,30,.2)}
  .sayilar .n{font-family:"Fredoka",sans-serif;font-size:28px;font-weight:600;color:var(--murekkep)}
  .sayilar .e{font-family:"Fredoka",sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);margin-top:2px}
  .rekor{
    font-family:"Fredoka",sans-serif;font-size:14px;color:var(--murekkep);text-align:center;
    text-shadow:0 1px 3px rgba(255,255,255,.9);
  }
  .rekor b{color:var(--turuncu);font-weight:600}

  /* ---------- parilti ---------- */
  #kafa{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .kivilcim{position:absolute;font-size:26px;line-height:1;opacity:0;animation:yukari 1.5s ease-out forwards;
    filter:drop-shadow(0 2px 4px rgba(224,154,52,.55))}
  @keyframes yukari{
    0%{opacity:0;transform:translateY(14px) scale(.5) rotate(-12deg)}
    22%{opacity:1;transform:translateY(-8px) scale(1.12) rotate(4deg)}
    60%{opacity:1;transform:translateY(-40px) scale(1) rotate(-3deg)}
    100%{opacity:0;transform:translateY(-84px) scale(.75) rotate(6deg)}
  }
  .komboBaloncuk{
    position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:61;pointer-events:none;
    font-family:"Fredoka",sans-serif;font-size:19px;font-weight:600;color:#fff;
    background:var(--turuncu);padding:9px 18px 10px;border-radius:99px;white-space:nowrap;
    box-shadow:0 6px 18px rgba(60,45,30,.35);animation:baloncuk 1.6s ease-out forwards;
  }
  @keyframes baloncuk{
    0%{opacity:0;transform:translateX(-50%) scale(.7)}
    16%{opacity:1;transform:translateX(-50%) scale(1.06)}
    26%{transform:translateX(-50%) scale(1)}
    78%{opacity:1}
    100%{opacity:0;transform:translateX(-50%) translateY(-16px) scale(.96)}
  }

  @media (max-width:400px){ .soru{font-size:18px} h1{font-size:31px} .uclu button{font-size:13px} }
  @media (prefers-reduced-motion:reduce){
    .kart{transition:none}
    .grup path{animation:none;stroke-dashoffset:0}
    .kirildi .grup path{animation:none;opacity:0}
    .kivilcim,.komboBaloncuk{animation-duration:.01s}
  }
</style>
</head>
<body>
<div id="zemin"></div>
<div id="app"></div>

<script>
const DESTE = [
 {n:1,q:"Derhal fesih hakkını kullanma süresi ne kadardır?",a:["6 iş günü – 1 yıl"]},
 {n:2,q:"İş müfettişleri tarafından düzenlenen rapor ve tutanaklara nereye, ne kadar sürede itiraz edilir?",a:["İş mahkemesine, 30 gün içinde"]},
 {n:3,q:"İhbar tazminatı alacaklarında hangi faiz uygulanır?",a:["Kanuni (yasal) faiz"]},
 {n:4,q:"Fesih bildirim süreleri nelerdir?",a:["6 aydan az: 2 hafta","6 ay – 1,5 yıl: 4 hafta","1,5 – 3 yıl: 6 hafta","3 yıldan fazla: 8 hafta"]},
 {n:5,q:"İşçinin aylık ücretinin ne kadarından fazlası haczedilemez veya başkasına devir ve temlik olunamaz?",a:["1/4’ünden fazlası"]},
 {n:6,q:"Bir işyerinde toplu işçi çıkarma sayılması için işçi sayısına göre en az kaç işçi çıkarılmalıdır?",a:["20 – 100 işçi: en az 10 işçi","101 – 300 işçi: en az %10 işçi","301 ve daha fazla: en az 30 işçi"]},
 {n:7,q:"İş Kanunu’nun uygulanmadığı işler hangileridir? (9 madde)",a:["1. Deniz ve hava taşıma işleri","2. 50’den az işçi çalıştırılan (50 dâhil) tarım ve orman işleri","3. Aile ekonomisi sınırındaki tarımsal yapı işleri","4. Aile üyeleri ve 3. dereceye kadar hısımlar arasında evlerde yapılan el sanatları","5. Ev hizmetleri","6. Çıraklar","7. Sporcular","8. Rehabilite edilenler","9. 507 sayılı Kanun’a uygun üç kişinin çalıştığı işyerleri"]},
 {n:8,q:"Kapsam dışı olsa da İş Kanunu’na tabi olan işler hangileridir? (6 madde)",a:["1. Kıyı, liman ve iskelelerde gemilere yükleme-boşaltma","2. Havacılığın bütün yer tesislerindeki işler","3. Tarım sanatları ile tarım aletleri, makine ve parçalarının yapıldığı atölye ve fabrikalar","4. Tarım işletmelerindeki yapı işleri","5. Halka açık veya işyeri eklentisi park-bahçe işleri","6. Deniz İş Kanunu kapsamına girmeyen su ürünleri üreticileriyle ilgili işler"]},
 {n:9,q:"Mutlak boşanma nedenleri nedir, hangileridir? (5 madde)",not:"Olayın ispatı boşanma kararı için yeterlidir. Hâkim ortak hayatın bitip bitmediğini sormaz. Kanunda sınırlı sayıda yer alır.",a:["1. Zina (aldatma)","2. Hayata kast","3. Pek kötü veya onur kırıcı davranış","4. Terk (evi bırakıp gitme)","5. Üç yıl süren fiili (eylemli) ayrılık"]},
 {n:10,q:"Nispi boşanma nedenleri nedir, hangileridir? (3 madde)",not:"Olayın varlığı tek başına yetmez. Evlilik birliğinin temelinden sarsıldığı ayrıca ispatlanmalıdır. Hâkim ortak hayatın çekilmez hâle gelip gelmediğini inceler.",a:["1. Suç işleme ve haysiyetsiz hayat sürme","2. Akıl hastalığı","3. Evlilik birliğinin temelinden sarsılması (şiddetli geçimsizlik)"]},
 {n:11,q:"En az %70 oranında engelli veya süreğen hastalığı olan çocuğun tedavisi için işçiye bir yıl içinde ne kadar ücretli mazeret izni verilir, hangi şartlarla?",a:["Bir yıl içinde toptan veya bölümler hâlinde 10 güne kadar ücretli mazeret izni.","Şartlar: çocuğun en az %70 oranında engelli veya süreğen hastalığı olması; çalışan ebeveynden sadece biri tarafından kullanılması; rapor sunulması"]},
 {n:12,q:"Doğru mu, yanlış mı? Emziren kadının çocuğuna süt verme amacıyla geçirdiği süre günlük çalışma süresinden sayılır.",a:["Doğru"]},
 {n:13,q:"İbra sözleşmesinin geçerlilik şartları nelerdir? (5 şart)",a:["1. Yazılı şekil — sözlü veya yazısız ibra geçersizdir","2. Bir aylık bekleme süresi — sözleşmenin sona erdiği tarihten itibaren en az bir ay geçmeli; fesih günü veya hemen sonrasında imzalananlar hükümsüzdür","3. Alacağın türü ve miktarı — hangi alacağın (kıdem, fazla mesai, yıllık izin) ödendiği ve tutarı rakamla açıkça yazılmalı; “her türlü alacağım kalmadı” gibi genel ifadeler geçersizdir","4. Banka aracılığıyla ödeme — ödeme, hak tutarına nazaran noksansız ve işçinin banka hesabına yapılmalı","5. Özgür irade — işçi imza atarken hile, baskı, tehdit veya hata altında olmamalı"]},
 {n:14,q:"Yıllık izin ücretine ilişkin zamanaşımı ne zaman başlar?",a:["İş sözleşmesinin sona erdiği tarihten itibaren"]},
 {n:15,q:"4857 sayılı İş Kanunu’na göre kısmi süreli (part-time) çalışma sayılabilmesi için haftalık çalışma süresi, tam süreli çalışmanın (45 saat) ne kadarı olmalıdır?",a:["En fazla üçte ikisi, yani 30 saat veya daha az"]},
 {n:16,q:"4857 sayılı İş Kanunu’nun 92. maddesine göre iş müfettişlerinin görevleri sırasında tuttuğu tutanakların ispat gücü nedir?",a:["Aksi kanıtlanıncaya kadar geçerlidir. Tutanaklardaki tespitler doğru kabul edilir; çürütmek için karşı tarafın eşdeğer delillerle aksini ispatlaması gerekir."]},
 {n:17,q:"Fazla çalışma süresi toplamı bir yılda en fazla ne kadar olabilir?",a:["270 saat"]},
 {n:18,q:"Fazla çalışma sebebiyle hak edilen serbest zaman ne kadar süre içinde kullanılabilir?",a:["6 ay içinde"]},
 {n:19,q:"Doğru mu, yanlış mı? Tüzel kişiliğin birleşme, katılma ya da tür değiştirmesiyle sona ermesi hâlinde birlikte sorumluluk hükümleri uygulanmaz.",a:["Doğru"]},
 {n:20,q:"İşçinin kasten verdiği zararlar ücretin hangi kısmı kadar takas edilebilir?",a:["Ücretin haczedilebilir kısmı kadar"]},
 {n:21,q:"İşverenin iş akdini haklı nedenle feshedebilmesi için işçinin işyerindeki mallara ne kadar zarar vermesi gerekir?",a:["Otuz günlük ücreti tutarıyla ödeyemeyecek derecede hasar ve kayba uğratması"]},
 {n:22,q:"Hastalık veya kaza nedeniyle bekleme süresi ne kadardır?",a:["İşçinin bildirim süresi + 6 hafta"]},
 {n:23,q:"Nafaka alacaklarında dörtte bir kuralı uygulanır mı?",a:["Uygulanmaz"]},
 {n:24,q:"Biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılıyorsa gebe ve kadına yapılan ayrımcılık eşitlik ilkesine aykırı mıdır?",a:["Aykırı değildir"]},
 {n:25,q:"Süreksiz iş nedir?",a:["En fazla otuz iş günü süren iştir"]},
 {n:26,q:"Bildirim süreleri asgari midir, artırılabilir mi?",a:["Asgaridir; sözleşme ile artırılabilir"]},
 {n:27,q:"İş güvencesinden yararlanma hükümleri işçi lehine değiştirilebilir mi?",a:["İşçi lehine hafifletilebilir ya da kaldırılabilir"]},
 {n:28,q:"İş kazasına bağlı maddi ve manevi tazminatta zamanaşımı ne kadardır?",a:["10 yıl"]},
 {n:29,q:"Hangi alacaklarda zamanaşımı 5 yıldır? (6 kalem)",a:["1. Yıllık izin ücreti","2. Kıdem tazminatı","3. Ücret","4. Bildirimsiz fesih tazminatı","5. Kötü niyet tazminatı","6. Eşit davranma ilkesine aykırılık tazminatı"]},
 {n:30,q:"4857 sayılı İş Kanunu kapsamında iş güvencesinden yararlanabilmek için hangi şartlar gerekir? (4 şart)",a:["1. İşçinin en az 6 ay kıdeminin olması","2. İşyerinde 30 veya daha fazla işçi çalışması","3. Sözleşmenin belirsiz süreli olması","4. İşçinin işveren vekili konumunda bulunmaması","Yer altı işlerinde 6 ay kıdem şartı aranmaz."]},
 {n:31,q:"Aynı işverenin işyerinde İş Kanunu kapsamına girmeksizin geçirilen süreler yıllık izin bakımından dikkate alınır mı?",a:["Evet, yıllık izin bahsine dâhil edilir"]},
 {n:32,q:"Yıllık izin kurulu oluşturma zorunluluğu kaç işçiden sonra doğar?",a:["100 işçiyi aşınca"]},
 {n:33,q:"Toplu izin hangi tarihler arasında yapılabilir?",a:["Nisan başı – Ekim sonu arasında"]},
 {n:34,q:"Karşılıklı ve anlaşarak mevcut işi sona erdirme sözleşmesinin adı nedir?",a:["Fesih sözleşmesi değil, ikale sözleşmesidir"]},
 {n:35,q:"İşten herhangi bir nedenle ayrılan işçiye talebi hâlinde verilen çalışma belgesinin özellikleri nelerdir?",a:["Resim ve harçtan muaftır. Yanlış bilgi varsa yeni işveren bunun için tazminat talep edebilir."]},
 {n:36,q:"Lojman işyeri kapsamında mıdır?",a:["Değildir"]},
 {n:37,q:"Yüzde usulü ile çalışmada kıdem tazminatı hesabı neye göre yapılır?",a:["İşçinin son bir yıllık ücret ortalamasına göre"]},
 {n:38,q:"Eşit işlem borcuna aykırılığı ispatla kim yükümlüdür?",a:["İşçi"]},
 {n:39,q:"Kötü niyet tazminatı ne kadardır?",a:["İhbar tazminatının üç katı kadardır"]},
 {n:40,q:"İşveren sağlık sebepleri, zorlayıcı sebepler veya işçinin gözaltına alınması sebepleriyle haklı nedenle fesih yaparsa işçi kıdem tazminatına hak kazanır mı?",a:["Evet, kıdem tazminatına hak kazanır"]},
 {n:41,q:"TMK m. 1009’a göre hangi sözleşmelerden doğan haklar tapu kütüğüne şerh edilebilir? (6 madde, hepsini say)",a:["1. Arsa payı karşılığı inşaat","2. Taşınmaz satış vaadi","3. Kira","4. Alım","5. Önalım","6. Gerialım"],notSon:"Bu liste sınırlı değildir; şerh edilebileceği kanunlarda açıkça öngörülen diğer haklar da tapu kütüğüne şerh edilebilir."},
 {n:42,q:"Taşınmaz satış vaadi sözleşmesi hangi madde uyarınca tapunun hangi hanesine şerh edilir ve bu şerh sözleşme alacaklısına ne sağlar? (2 sonuç)",a:["TMK m. 1009 uyarınca tapunun beyanlar hanesine şerh edilir.","1. Sözleşmeden kaynaklanan kişisel hakkını kuvvetlendirir","2. Hakkını üçüncü kişilere karşı ileri sürme olanağı kazanır"]},
 {n:43,q:"Taşınmaz satış vaadi şerhi hangi kanun maddesi uyarınca ne kadar süre geçerlidir, sürenin dolmasıyla ne olur?",a:["Tapu Kanunu m. 26/6 uyarınca beş yıl geçerlidir. Beş yılın dolmasıyla kaydı sicilden silinir ve şerh gücünü yitirir."]},
 {n:44,q:"Taşınmaz satış vaadi şerhinden sonra beş yıl içinde kayda işlenen haciz, ipotek ve benzeri, alacaklının haklarını kısıtlayacak nitelikteki şerhler sözleşme alacaklısını bağlar mı?",a:["Bağlamaz"]},
 {n:45,q:"Tasarruf yetkisini kısıtlayan şerhlerde hangi şerh için hangi belge aranır? (6 madde, hepsini say)",a:["1. İhtiyati tedbir: mahkeme kararı veya yazısı","2. Kamu haczi, iflas veya konkordato ile verilen sürenin şerhi: yetkili merciin resmi yazısı","3. Aile konutu şerhi: merkezi nüfus idaresi sisteminden veya nüfus müdürlüğünden alınan yerleşim yeri belgesi ile medeni hali gösterir nüfus kayıt örneği","4. Aile yurdu kurulması: mahkeme kararı veya yazısı","5. Eşlerden birinin taşınmaz üzerindeki tasarruf yetkisinin kaldırılması: mahkeme kararı","6. Kanunların yasaklayıcı şerh verilmesini öngördüğü diğer haller: kanunda belirtilen belgeler"]},
 {n:46,q:"Aile konutu şerhi için hangi belgeler aranır? (2 belge)",a:["1. Merkezi nüfus idaresi sisteminden veya nüfus müdürlüğünden alınan yerleşim yeri belgesi","2. Medeni hali gösterir nüfus kayıt örneği"]},
 {n:47,q:"TMK m. 1011’e göre geçici tescil şerhi hangi hallerde verilebilir? (2 madde)",a:["1. İddia edilen bir ayni hakkın güvence altına alınması gerekiyorsa","2. Tasarruf yetkisini belirleyen belgelerdeki noksanlıkların sonradan tamamlanmasına kanun olanak tanıyorsa"]},
 {n:48,y:1,q:"Taşınmaz mülkiyetini aslen kazanma halleri nelerdir? (4 madde, hepsini say)",a:["1. İşgal","2. Yeni arazi oluşumu","3. Zamanaşımı","4. Cebri icra"]},
 {n:49,y:1,q:"Tüzel kişi lehine tanınan intifa hakkı en çok ne kadar devam eder?",a:["En çok 100 yıl"]},
 {n:50,y:1,q:"Taşınmaz yükü, taşınmazın malikini neyle yükümlü kılar?",a:["O taşınmazla ilgili diğer bir kimseye bir şey vermek veya yapmakla yükümlü kılar"]},
 {n:51,y:1,q:"Yapmama edimi taşınmaz yükünün içeriğini oluşturur mu?",a:["Oluşturmaz"]},
 {n:52,y:1,q:"Taşınmaz yükünde malik bu edimlerden ne ile sorumludur?",a:["Yalnızca o taşınmazla sorumludur"]},
 {n:53,y:1,q:"Yüklü taşınmaz neye teminat oluşturur?",a:["Malikin zorunlu olduğu edimlere"]},
 {n:54,q:"Apartman yönetim planının değiştirilebilmesi için hangi çoğunluk gerekir?",a:["Beşte dört çoğunluk"]},
 {n:55,q:"Tapu kütüğündeki tescile iyiniyetle dayanarak mülkiyet veya bir başka ayni hak kazanan üçüncü kişinin kazanımı ne olur?",a:["Bu kazanım korunur"]},
 {n:56,q:"İntifa hakkı ve oturma hakkı devredilebilir mi, miras yoluyla geçer mi?",a:["Hiçbir suretle devredilemez ve miras yoluyla geçmez"]},
 {n:57,q:"İntifa hakkı ve oturma hakkı neden eşyaya bağlı olarak kurulamaz?",a:["Devredilemedikleri ve miras yoluyla geçmedikleri için"]},

const MESAJ = [
  {n:3,  t:"üç üst üste"},
  {n:5,  t:"seri kuruldu"},
  {n:8,  t:"oha çok iyi gidiyorsun"},
  {n:12, t:"durdurulamıyorsun"},
  {n:16, t:"bu deste sana az geliyor"},
  {n:20, t:"yirmi kombo. ciddi misin"},
  {n:25, t:"deste teslim oldu"}
];

let S = {};

/* ---------- yildiz hafizasi ---------- */
const ANAHTAR = "hukukkart_yildiz";
let YILDIZ = new Set();

function yildizBaslat(){
  let kayit = null;
  try{ kayit = localStorage.getItem(ANAHTAR); }catch(e){}
  if(kayit){
    try{ YILDIZ = new Set(JSON.parse(kayit)); return; }catch(e){}
  }
  YILDIZ = new Set(DESTE.filter(k => k.y).map(k => k.n));
}
function yildizKaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify([...YILDIZ])); }catch(e){}
}
function yildizCevir(n, btn){
  if(YILDIZ.has(n)) YILDIZ.delete(n); else YILDIZ.add(n);
  yildizKaydet();
  const acik = YILDIZ.has(n);
  btn.textContent = acik ? "★" : "☆";
  btn.classList.toggle("acik", acik);
  btn.setAttribute("aria-pressed", acik ? "true" : "false");
}
function yildizTusu(n){
  const acik = YILDIZ.has(n);
  return `<button class="yildiz-tus${acik?" acik":""}" aria-pressed="${acik}"
    aria-label="önemli olarak işaretle" onclick="yildizCevir(${n},this)">${acik?"★":"☆"}</button>`;
}
yildizBaslat();


/* ---------- kutlama efekti ---------- */
const KAFA_KUTU = document.createElement("div");
KAFA_KUTU.id = "kafa";
document.body.appendChild(KAFA_KUTU);

let kafaZaman = null;
function kafaGoster(mod, yazi){
  if(mod !== "sicrar") return;
  KAFA_KUTU.innerHTML = "";
  const semboller = ["\u2726","\u2727","\u2b50","\u2726","\u2728","\u2727"];
  for(let i=0;i<7;i++){
    const s = document.createElement("div");
    s.className = "kivilcim";
    s.textContent = semboller[i % semboller.length];
    s.style.left = (12 + Math.random()*76) + "%";
    s.style.top  = (46 + Math.random()*34) + "%";
    s.style.fontSize = (18 + Math.random()*20) + "px";
    s.style.animationDelay = (Math.random()*0.35) + "s";
    KAFA_KUTU.appendChild(s);
  }
  if(yazi){
    const b = document.createElement("div");
    b.className = "komboBaloncuk";
    b.textContent = yazi;
    KAFA_KUTU.appendChild(b);
  }
  clearTimeout(kafaZaman);
  kafaZaman = setTimeout(() => { KAFA_KUTU.innerHTML = ""; }, 2000);
}

function karistir(a){
  const d = a.slice();
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}

function basla(mod){
  mod = mod || "hepsi";
  const kaynak = mod === "yildiz" ? DESTE.filter(k => YILDIZ.has(k.n)) : DESTE;
  if(!kaynak.length) return;
  S = {
    mod: mod,
    sira: karistir(kaynak),
    tekrar: [],
    i: 0,
    faz: "ana",
    toplam: kaynak.length,
    kombo: 0,
    rekor: 0,
    bildim: 0, yarim: 0, bilemedim: 0,
    arka: false,
    yazi: "",
    kirik: false,
    mesaj: "",
    gecmis: [],
    bakis: null
  };
  ciz();
}

const el = document.getElementById("app");
const kacir = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- cetele ---------- */
function ceteleHtml(){
  const n = S.kombo;
  const tamGrup = Math.floor(n/5), kalan = n%5;
  let g = "";
  const cizgi = (x)=>`<path d="M${x} 2 L${x} 18"/>`;  // dikey cetele
  const capraz = `<path d="M-1 16 L23 4"/>`;
  for(let k=0;k<tamGrup;k++){
    g += `<div class="grup"><svg viewBox="0 0 26 20">${cizgi(2)}${cizgi(8)}${cizgi(14)}${cizgi(20)}${capraz}</svg></div>`;
  }
  if(kalan>0){
    let s="";
    for(let k=0;k<kalan;k++) s += cizgi(2+k*6);
    g += `<div class="grup"><svg viewBox="0 0 26 20">${s}</svg></div>`;
  }
  const sicak = n>=8 ? " sicak" : "";
  const kirik = S.kirik ? " kirildi" : "";
  const yazi = S.kirik
    ? `seri bitti · en yüksek ${S.rekor}`
    : (S.mesaj ? S.mesaj : (n>0 ? `${n} kombo` : ""));
  return `<div class="cetele-alan${sicak}${kirik}">
      <div class="cetele">${g}</div>
      <div class="kombo-yazi">${kacir(yazi)}</div>
    </div>`;
}

/* ---------- ekranlar ---------- */
function girisEkrani(){
  const yildizli = DESTE.filter(k => YILDIZ.has(k.n)).length;
  el.innerHTML = `
   <div class="orta">
     <div class="pano">
       <h1>Hukuk<br>kart <em>destesi</em></h1>
       <p class="alt">${DESTE.length} kart, karışık sırayla. Cevabı yaz, kartı çevir, kendini değerlendir.</p>
     <div class="kural">
       <div><b>01</b><span>Cevabını önce yaz, sonra çevir. Kendi cümlen karşındayken kendini kandırman zor.</span></div>
       <div><b>02</b><span>Kimse cevabını kontrol etmiyor. Farklı kelimelerle doğru yazmak serbest.</span></div>
       <div><b>03</b><span>Üst üste bildiklerin çetele olarak birikir. Bir yanlış çeteleyi siler.</span></div>
       <div><b>04</b><span>Bilemediğin kartlar seansın sonunda bir kez daha gelir.</span></div>
       <div><b>05</b><span>Geçtiğin kartlara "geri" ile bakabilirsin — bakmak serbest, puan değişmez.</span></div>
       <div><b>06</b><span>Kartın köşesindeki yıldıza basarsan o kart önemliye ayrılır, ayrıca çalışabilirsin.</span></div>
     </div></div>
     <div style="display:flex;flex-direction:column;gap:9px">
       <button class="dolu" onclick="basla('hepsi')">Desteyi aç — ${DESTE.length} kart</button>
       <button onclick="basla('yildiz')" ${yildizli ? "" : "disabled"}>★ Yıldızlıları çalış — ${yildizli} kart</button>
     </div>
   </div>`;
}

function cevapHtml(k){
  const not = k.not ? `<div class="not">${kacir(k.not)}</div>` : "";
  const notSon = k.notSon ? `<div class="not son">${kacir(k.notSon)}</div>` : "";
  const satirlar = k.a.map(s=>{
    const m = s.match(/^(\d+)\.\s+(.*)$/);
    return m ? `<div class="madde"><span>${m[1]}</span><span>${kacir(m[2])}</span></div>`
             : `<p>${kacir(s)}</p>`;
  }).join("");
  return `<div class="cevap">${not}${satirlar}${notSon}</div>`;
}

const ROZET = {
  bildim:    ["bildim",    "r-bildim"],
  yarim:     ["yarım",     "r-yarim"],
  bilemedim: ["bilemedim", "r-bilemedim"]
};

function gecmisEkrani(){
  const g = S.gecmis[S.bakis];
  const k = g.k;
  const [yazi, sinif] = ROZET[g.sonuc];
  const senin = g.yazi.trim()
    ? `<div class="senin"><div class="etiket">senin cevabın</div><div class="metin">${kacir(g.yazi.trim())}</div></div>`
    : "";

  el.innerHTML = `
    <div class="serit">
      <div class="sol">
        <button class="menu-tus" onclick="basaDon()" aria-label="başa dön">⌂</button>
        <div class="ilerleme">geçmiş · <b>${S.bakis+1}</b> / ${S.gecmis.length}</div>
      </div>
      <div class="cetele-alan"><div class="kombo-yazi">puan değişmez</div></div>
    </div>
    <div class="sahne">
      <div class="kart arka" id="kart">
        <div class="kart-ust">${yildizTusu(k.n)}<span class="kart-no">${k.n}</span></div>
        <div class="gecmis-baslik">
          <div class="etiket" style="margin:0">soru</div>
          <span class="sonuc-rozet ${sinif}">${yazi}</span>
        </div>
        <div class="soru">${kacir(k.q)}</div>
        <div class="ayrac"></div>
        ${senin}
        <div class="etiket">cevap</div>
        ${cevapHtml(k)}
      </div>
    </div>
    <div class="dip">
      <div class="ikili">
        <button onclick="gecmisGez(-1)" ${S.bakis === 0 ? "disabled" : ""}>‹ daha eski</button>
        <button onclick="gecmisGez(1)" ${S.bakis === S.gecmis.length-1 ? "disabled" : ""}>daha yeni ›</button>
      </div>
      <button class="dolu" onclick="gecmistenCik()">Kaldığım yere dön</button>
    </div>`;
  window.scrollTo(0,0);
}

function basaDon(){
  S = {};
  girisEkrani();
}

function gecmiseGit(){
  const t = document.getElementById("yazi");
  if(t) S.yazi = t.value;
  S.bakis = S.gecmis.length - 1;
  ciz();
}
function gecmisGez(yon){
  const y = S.bakis + yon;
  if(y < 0 || y >= S.gecmis.length) return;
  S.bakis = y;
  gecmisEkrani();
}
function gecmistenCik(){
  S.bakis = null;
  ciz();
}

function kartEkrani(){
  const k = S.faz === "ana" ? S.sira[S.i] : S.tekrar[S.i];
  const toplam = S.faz === "ana" ? S.toplam : S.tekrar.length;
  const rozet = S.faz === "tekrar" ? `<span class="tekrar-rozet">tekrar</span>`
              : (S.mod === "yildiz" ? `<span class="tekrar-rozet">yıldızlı</span>` : "");

  let govde, dip;
  if(!S.arka){
    govde = `
      <div class="etiket">soru</div>
      <div class="soru">${kacir(k.q)}</div>
      <div class="yazi-alan">
        <textarea id="yazi" placeholder="cevabını buraya yaz — istersen boş bırak" spellcheck="false">${kacir(S.yazi)}</textarea>
      </div>`;
    dip = `
      <button class="dolu" onclick="cevir()">Kartı çevir</button>
      <div class="ipucu">yazmadan da çevirebilirsin</div>`;
  } else {
    const senin = S.yazi.trim()
      ? `<div class="senin"><div class="etiket">senin cevabın</div><div class="metin">${kacir(S.yazi.trim())}</div></div>`
      : "";
    govde = `
      <div class="etiket">soru</div>
      <div class="soru">${kacir(k.q)}</div>
      <div class="ayrac"></div>
      ${senin}
      <div class="etiket">cevap</div>
      ${cevapHtml(k)}`;
    dip = `
      <div class="uclu">
        <button class="b-bilemedim" onclick="degerlendir('bilemedim')">bilemedim</button>
        <button class="b-yarim" onclick="degerlendir('yarim')">yarım</button>
        <button class="b-bildim" onclick="degerlendir('bildim')">bildim</button>
      </div>
      <div class="ipucu">yarım komboyu bozmaz ama artırmaz</div>`;
  }

  el.innerHTML = `
    <div class="serit">
      <div class="sol">
        <button class="menu-tus" onclick="basaDon()" aria-label="başa dön">⌂</button>
        ${S.gecmis.length ? `<button class="geri-tus" onclick="gecmiseGit()" aria-label="önceki karta bak">‹ geri</button>` : ""}
        <div class="ilerleme"><b>${S.i+1}</b> / ${toplam}${rozet}</div>
      </div>
      ${ceteleHtml()}
    </div>
    <div class="sahne">
      <div class="kart${S.arka?" arka":""}" id="kart">
        <div class="kart-ust">${yildizTusu(k.n)}<span class="kart-no">${k.n}</span></div>
        ${govde}
      </div>
    </div>
    <div class="dip">${dip}</div>`;

  const t = document.getElementById("yazi");
  if(t){
    t.addEventListener("input", e => { S.yazi = e.target.value; });
    t.addEventListener("keydown", e => {
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) cevir();
    });
  }
}

function bitisEkrani(){
  el.innerHTML = `
   <div class="orta">
     <div class="pano">
       <h1>Deste<br><em>bitti</em></h1>
       <p class="alt">Kartlar karışık geliyor, yeniden açtığında sıra değişir.</p>
     </div>
     <div class="sayilar">
       <div><div class="n">${S.bildim}</div><div class="e">bildim</div></div>
       <div><div class="n">${S.yarim}</div><div class="e">yarım</div></div>
       <div><div class="n">${S.bilemedim}</div><div class="e">bilemedim</div></div>
     </div>
     <div class="rekor">en yüksek kombo — <b>${S.rekor}</b></div>
     <div style="display:flex;flex-direction:column;gap:9px">
       <button class="dolu" onclick="basla(S.mod)">Yeniden başla</button>
       <button onclick="gecmiseGit()">Kartlara geri bak</button>
       <button onclick="basaDon()">Başa dön</button>
     </div>
   </div>`;
}

/* ---------- akis ---------- */
function animasyonlu(fn){
  const kart = document.getElementById("kart");
  const azHareket = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!kart || azHareket){ fn(); ciz(); return; }
  kart.classList.add("yarim");
  setTimeout(()=>{ fn(); ciz(); }, 190);
}

function cevir(){
  if(S.arka) return;
  const t = document.getElementById("yazi");
  if(t) S.yazi = t.value;
  animasyonlu(()=>{ S.arka = true; });
}

function degerlendir(sonuc){
  S.kirik = false;
  S.mesaj = "";
  S.gecmis.push({
    k: S.faz === "ana" ? S.sira[S.i] : S.tekrar[S.i],
    yazi: S.yazi,
    sonuc: sonuc
  });

  if(sonuc === "bildim"){
    S.bildim++;
    S.kombo++;
    if(S.kombo > S.rekor) S.rekor = S.kombo;
    const m = MESAJ.filter(x => x.n === S.kombo)[0];
    if(m) S.mesaj = m.t;
    else if(S.kombo > 25 && S.kombo % 5 === 0) S.mesaj = `${S.kombo} kombo`;
    if(S.kombo % 5 === 0) kafaGoster("sicrar", S.mesaj || `${S.kombo} kombo`);
  } else if(sonuc === "yarim"){
    S.yarim++;
  } else {
    S.bilemedim++;
    if(S.kombo > 0) S.kirik = true;
    S.kombo = 0;
    const k = S.faz === "ana" ? S.sira[S.i] : S.tekrar[S.i];
    if(S.faz === "ana") S.tekrar.push(k);
  }

  animasyonlu(()=>{
    S.arka = false;
    S.yazi = "";
    S.i++;
    if(S.faz === "ana" && S.i >= S.sira.length){
      if(S.tekrar.length){ S.faz = "tekrar"; S.i = 0; S.tekrar = karistir(S.tekrar); }
      else S.faz = "bitti";
    } else if(S.faz === "tekrar" && S.i >= S.tekrar.length){
      S.faz = "bitti";
    }
  });
}

function ciz(){
  if(!S.faz) return girisEkrani();
  if(S.bakis !== null && S.bakis !== undefined) return gecmisEkrani();
  if(S.faz === "bitti") return bitisEkrani();
  kartEkrani();
  window.scrollTo(0,0);
}

girisEkrani();
</script>
</body>
</html>
